services:
  db:
    image: postgres:15-alpine
    container_name: xpert_erp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xpert}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xpert_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-xpert_erp}
    command: >
      postgres
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
      -c archive_cleanup_command='pg_archivecleanup /var/lib/postgresql/wal_archive %r'
      -c max_wal_senders=3
      -c wal_keep_size=128
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - pg_wal_archive:/var/lib/postgresql/wal_archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xpert} -d ${POSTGRES_DB:-xpert_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: xpert_erp_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_dev_password}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: xpert_erp_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      MP_MAX_MESSAGES: 200

  minio:
    image: minio/minio:latest
    container_name: xpert_erp_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_dev_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile.backend
    container_name: xpert_erp_api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # Override host-mapped ports with Docker internal service names
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-xpert}:${POSTGRES_PASSWORD:-xpert_dev_password}@db:5432/${POSTGRES_DB:-xpert_erp}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379/0"
      # MinIO is reachable via the compose service name, not localhost, inside the container
      S3_ENDPOINT_URL: "http://minio:9000"
      # ...but presigned URLs are opened by the browser, which must use the host-mapped port
      S3_PUBLIC_ENDPOINT_URL: "http://localhost:9000"
      # Logo is inside the backend volume mounted at /app
      PDF_GARAGE_LOGO_PATH: "/app/assets/logo.png"
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - ../logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-config uvicorn_log_config.json

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    container_name: xpert_erp_backup
    profiles: ["backup"]
    env_file:
      - ../.env
    volumes:
      - ../infra/scripts:/scripts:ro
      - pg_wal_archive:/var/lib/postgresql/wal_archive:ro
    entrypoint: ["/bin/bash", "/scripts/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
  minio_data:
  pg_wal_archive:
