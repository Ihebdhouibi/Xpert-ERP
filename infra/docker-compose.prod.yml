# Production Docker Compose — used by Dokploy on the OVH server.
#
# Key differences from docker-compose.yml (dev):
#   - No env_file reference — Dokploy injects all env vars directly
#   - No source-code volume mounts — image is used as-is
#   - gunicorn instead of uvicorn --reload
#   - mailpit removed — real SMTP credentials from env
#   - user: root removed — non-root user from Dockerfile
#   - Logs stored in a named Docker volume
#   - S3_PUBLIC_ENDPOINT_URL and SMTP settings come from env vars (set in Dokploy)

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:15-alpine
    container_name: xpert_erp_db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: >
      postgres
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
      -c archive_cleanup_command='pg_archivecleanup /var/lib/postgresql/wal_archive %r'
      -c max_wal_senders=3
      -c wal_keep_size=128
    volumes:
      - pg_data:/var/lib/postgresql/data
      - pg_wal_archive:/var/lib/postgresql/wal_archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: xpert_erp_redis
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: xpert_erp_minio
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile.backend
      args:
        OCR_BACKEND: onnx
    container_name: xpert_erp_api
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      S3_ENDPOINT_URL: "http://minio:9000"
      PDF_GARAGE_LOGO_PATH: "/app/assets/logo.png"
      # All remaining required vars — passed through from Dokploy's env injection
      SECRET_KEY: "${SECRET_KEY}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY}"
      S3_BUCKET_DOCUMENTS: "${S3_BUCKET_DOCUMENTS}"
      S3_BUCKET_MEDIA: "${S3_BUCKET_MEDIA}"
      S3_PUBLIC_ENDPOINT_URL: "${S3_PUBLIC_ENDPOINT_URL}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS}"
      FRONTEND_BASE_URL: "${FRONTEND_BASE_URL}"
      ENVIRONMENT: "${ENVIRONMENT}"
      DATABASE_ECHO: "${DATABASE_ECHO}"
      LOG_LEVEL: "${LOG_LEVEL}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_USE_TLS: "${SMTP_USE_TLS}"
      SMTP_USERNAME: "${SMTP_USERNAME}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      SMTP_FROM_ADDRESS: "${SMTP_FROM_ADDRESS}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME}"
    ports:
      - "8000:8000"
    volumes:
      - app_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/v1/health\")' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    # gunicorn (production WSGI server, configured via gunicorn.conf.py)
    command: gunicorn app.main:app -c gunicorn.conf.py

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/Dockerfile.frontend
    container_name: xpert_erp_frontend
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ | grep -q '<html' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    container_name: xpert_erp_backup
    profiles: ["backup"]
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./scripts:/scripts:ro
      - pg_wal_archive:/var/lib/postgresql/wal_archive:ro
    entrypoint: ["/bin/bash", "/scripts/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
  minio_data:
  pg_wal_archive:
  app_logs:
