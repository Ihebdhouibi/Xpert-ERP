name: Create GitHub Issues from issues.txt

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print issues without creating them)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      skip_existing:
        description: "Skip issues whose title already exists in the repo"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  create-issues:
    name: Parse and create GitHub Issues
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run issue creation script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/create_github_issues.py \
            --issues-file issues.txt \
            ${{ inputs.dry_run == 'true' && '--dry-run' || '' }} \
            ${{ inputs.skip_existing == 'true' && '--skip-existing' || '' }}
