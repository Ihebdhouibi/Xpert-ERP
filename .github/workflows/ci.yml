name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  backend:
    name: Backend (lint + type-check + test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: xpert
          POSTGRES_PASSWORD: xpert_dev
          POSTGRES_DB: xpert_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xpert"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Lint (ruff check)
        working-directory: backend
        run: ruff check app tests

      - name: Format check (ruff format)
        working-directory: backend
        run: ruff format --check app tests

      - name: Type check (mypy)
        working-directory: backend
        run: mypy app

      - name: Test (pytest + coverage)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://xpert:xpert_dev@localhost:5432/xpert_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-32-chars-minimum
          ENVIRONMENT: test
          LOG_LEVEL: WARNING
          S3_ENDPOINT_URL: http://localhost:9000
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
          S3_BUCKET_DOCUMENTS: xpert-documents
          S3_BUCKET_MEDIA: xpert-media
        run: pytest

  frontend:
    name: Frontend (type-check + lint + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000
        run: npm run build
