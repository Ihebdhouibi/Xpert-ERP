# Pre-commit hooks for Xpert ERP.
#
# One-time setup per clone (run inside the project venv):
#     pip install pre-commit
#     pre-commit install
#
# Run against the whole repo on demand:
#     pre-commit run --all-files
#
# These hooks guard against the encoding/whitespace problems we keep hitting:
# UTF-8 BOM, mojibake / replacement chars, missing EOF newline, trailing
# whitespace and mixed CRLF/LF line endings.
minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: fix-byte-order-marker      # strip UTF-8 BOM
      - id: end-of-file-fixer          # ensure exactly one trailing newline
      - id: trailing-whitespace        # strip trailing spaces/tabs
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending          # normalize to LF
        args: [--fix=lf]
      - id: check-merge-conflict       # block leftover <<<<<<< / >>>>>>> markers
      - id: check-case-conflict        # block names that collide on case-insensitive FS
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-yaml
      - id: check-json
      - id: check-toml

  - repo: local
    hooks:
      - id: no-mojibake
        name: detect mojibake / U+FFFD replacement chars
        description: >-
          Fail when a text file contains the Unicode replacement char or a
          high-confidence UTF-8-decoded-as-Latin1 mojibake sequence
          (common when French accents get corrupted).
        entry: python scripts/git-hooks/check_mojibake.py
        language: system
        types: [text]
