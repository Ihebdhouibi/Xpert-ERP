<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <!-- Apple touch icon — no rounded corners (iOS applies its own mask) -->
  <rect width="180" height="180" fill="#0F172A"/>

  <defs>
    <linearGradient id="xGradApple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <line x1="54" y1="54" x2="126" y2="126" stroke="url(#xGradApple)" stroke-width="19" stroke-linecap="round"/>
  <line x1="126" y1="54" x2="54" y2="126" stroke="url(#xGradApple)" stroke-width="19" stroke-linecap="round"/>
</svg>
