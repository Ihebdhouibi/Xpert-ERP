# Nginx config for the Xpert-ERP SPA frontend.
# Serves the Vite-built static files and reverse-proxies /api to the backend.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── SPA fallback ──────────────────────────────────────────────────────────
    # All non-file requests (React Router paths like /invoices/123) serve the
    # single index.html; the browser JS router takes over from there.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API reverse proxy ─────────────────────────────────────────────────────
    # The frontend calls /api/v1/... (relative URLs, no hardcoded host).
    # Nginx forwards those to the api service on the compose network.
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow large file uploads (OCR documents, etc.)
        client_max_body_size 50m;

        # Generous timeout for long-running OCR jobs
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    # ── Static asset caching ──────────────────────────────────────────────────
    # Vite generates hashed filenames (e.g. index-A1B2C3D4.js) so these are
    # safe to cache aggressively. index.html is never cached.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache index.html so deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css text/javascript application/javascript
                    application/json image/svg+xml;
}
