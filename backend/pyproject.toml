[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xpert-erp-backend"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    # Web framework
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.3",
    "gunicorn==23.0.0",
    # Database
    "sqlalchemy[asyncio]==2.0.41",
    "asyncpg==0.30.0",
    "alembic==1.15.2",
    # Validation / settings
    "pydantic[email]==2.11.4",
    "pydantic-settings==2.9.1",
    # Security
    "argon2-cffi==23.1.0",
    "python-jose[cryptography]==3.3.0",
    "cryptography==44.0.3",
    # Redis
    "redis[hiredis]==5.2.1",
    # HTTP client
    "httpx==0.28.1",
    # Email
    "aiosmtplib==3.0.2",
    "jinja2==3.1.6",
    # Logging
    "structlog==25.3.0",
    # Object storage
    "boto3==1.38.18",
    # Excel
    "openpyxl==3.1.5",
    # PDF
    "weasyprint==65.1",
    # Form parsing (multipart)
    "python-multipart==0.0.20",
    # Image processing (EXIF stripping, server-side re-encode)
    "Pillow==11.2.1",
    # Scheduler
    "apscheduler==3.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
    "pytest-cov==6.1.0",
    "httpx==0.28.1",
    "aiosqlite==0.21.0",
    "ruff==0.11.10",
    "mypy==1.16.0",
    "types-redis==4.6.0.20241004",
    "factory-boy==3.3.3",
    "faker==37.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "T20"]
ignore = ["S101", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=50"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/migrations/*"]
